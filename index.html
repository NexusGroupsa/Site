<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nexus Group</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
  overflow-y:auto;
  position:relative;

  background:
    radial-gradient(circle at 50% 50%, rgba(184,147,95,.10) 0%, transparent 55%),
    radial-gradient(circle at 15% 20%, rgba(50,69,91,.06) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(50,69,91,.06) 0%, transparent 45%),
    linear-gradient(135deg, #FDFCFA 0%, #F7F4EF 50%, #F0EBE3 100%);
  background-attachment:fixed;
}

body::before{
  content:'';
  position:fixed;inset:0;pointer-events:none;
  opacity:.55;
  background-image:
    linear-gradient(rgba(50,69,91,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(50,69,91,.035) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 75%);
}

body::after{
  content:'';
  position:fixed;inset:0;pointer-events:none;
  opacity:.20;
  background-image:radial-gradient(rgba(50,69,91,.10) 1px, transparent 1px);
  background-size:24px 24px;
}

.glow-1{
  position:fixed;
  width:600px;height:600px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(226,232,240,.7) 0%,transparent 70%);
  top:-250px;left:-200px;
  pointer-events:none;
  filter:blur(50px);
  z-index:1;
}
.glow-2{
  position:fixed;
  width:600px;height:600px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(184,147,95,.18) 0%,transparent 70%);
  bottom:-250px;right:-200px;
  pointer-events:none;
  filter:blur(50px);
  z-index:1;
}

.center-glow{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:900px;height:900px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(184,147,95,.14) 0%,
    rgba(184,147,95,.06) 35%,
    transparent 70%);
  pointer-events:none;
  z-index:1;
  animation:glowPulse 6s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
}

/* الحاوية */
.container{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:36px;
  text-align:center;
  animation:fadeIn 1.2s cubic-bezier(.2,.7,.3,1);
  min-height:100vh;
  min-height:100dvh;
  padding:40px 20px 60px;
  width:100%;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px) scale(.96)}
  to{opacity:1;transform:none}
}

/* الشعار */
.logo{
  width:clamp(300px, 45vw, 800px);
  height:auto;
  max-height:65vh;
  object-fit:contain;
  display:block;
  filter:
    drop-shadow(0 20px 40px rgba(50,69,91,.18))
    drop-shadow(0 4px 12px rgba(184,147,95,.10));
  animation:floatLogo 4s ease-in-out infinite;
  position:relative;
  z-index:3;
}

@keyframes floatLogo{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* الفاصل الذهبي */
.separator{
  display:flex;
  align-items:center;
  gap:14px;
  width:clamp(280px, 40vw, 600px);
  opacity:0;
  animation:fadeInSeparator 1s ease .6s forwards;
  position:relative;
  z-index:3;
}

@keyframes fadeInSeparator{
  to{opacity:1}
}

.separator-line{
  flex:1;
  height:1px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(184,147,95,.6) 50%,
    transparent 100%);
}
.separator-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:linear-gradient(145deg,#B8935F,#E5C99F);
  box-shadow:
    0 0 12px rgba(184,147,95,.7),
    0 0 24px rgba(184,147,95,.35);
  animation:dotPulse 2.5s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:.85}
}

/* ===== فقاعات الصابون ===== */
.partners{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:clamp(22px, 5vw, 70px);
  width:clamp(280px, 70vw, 900px);
  opacity:0;
  animation:fadeInSeparator 1s ease .9s forwards;
  position:relative;
  z-index:3;
}

.bubble{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:clamp(76px, 12vw, 140px);
  height:clamp(76px, 12vw, 140px);
  border-radius:50%;
  text-decoration:none;
  isolation:isolate;

  background:
    radial-gradient(circle at 30% 25%,
      rgba(255,255,255,.95) 0%,
      rgba(255,255,255,.35) 18%,
      rgba(255,255,255,.06) 42%,
      rgba(255,255,255,0) 60%),
    radial-gradient(circle at 70% 80%,
      rgba(184,147,95,.18) 0%,
      rgba(184,147,95,.04) 40%,
      transparent 70%),
    radial-gradient(circle at 50% 50%,
      rgba(226,236,245,.55) 0%,
      rgba(226,236,245,.15) 60%,
      rgba(255,255,255,.05) 100%);

  border:1px solid rgba(255,255,255,.65);
  box-shadow:
    0 0 0 1px rgba(184,147,95,.16),
    0 14px 30px rgba(50,69,91,.12),
    0 6px 14px rgba(50,69,91,.08),
    inset 0 2px 6px rgba(255,255,255,.9),
    inset 0 -10px 22px rgba(184,147,95,.10),
    inset 0 0 24px rgba(255,255,255,.35);

  backdrop-filter:blur(10px) saturate(1.3);
  -webkit-backdrop-filter:blur(10px) saturate(1.3);

  transition:transform .5s cubic-bezier(.2,.7,.3,1),
             box-shadow .5s ease,
             border-color .5s ease;
  overflow:hidden;
}

.bubble::before{
  content:'';
  position:absolute;
  top:10%;
  left:18%;
  width:34%;
  height:24%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(255,255,255,.95) 0%,
    rgba(255,255,255,.5) 45%,
    transparent 75%);
  filter:blur(2px);
  transform:rotate(-25deg);
  pointer-events:none;
  z-index:2;
}

.bubble::after{
  content:'';
  position:absolute;
  bottom:12%;
  right:20%;
  width:26%;
  height:16%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(255,255,255,.65) 0%,
    rgba(255,255,255,.2) 50%,
    transparent 80%);
  filter:blur(2px);
  transform:rotate(-15deg);
  pointer-events:none;
  z-index:2;
}

.bubble svg{
  width:46%;
  height:46%;
  position:relative;
  z-index:3;
  transition:transform .5s cubic-bezier(.2,.7,.3,1), filter .5s ease;
  filter:drop-shadow(0 2px 6px rgba(50,69,91,.18));
}

.bubble .bubble-logo{
  width:52%;
  height:52%;
  object-fit:contain;
  position:relative;
  z-index:3;
  transition:transform .5s cubic-bezier(.2,.7,.3,1), filter .5s ease;
  filter:drop-shadow(0 2px 6px rgba(50,69,91,.18));
}

.bubble .bubble-logo-ward{
  width:80%;
  height:80%;
  object-fit:contain;
  position:relative;
  z-index:3;
  transition:transform .5s cubic-bezier(.2,.7,.3,1), filter .5s ease;
  filter:drop-shadow(0 2px 6px rgba(50,69,91,.18));
}

.bubble .halo{
  position:absolute;
  inset:-14px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    rgba(184,147,95,.30) 0%,
    rgba(184,147,95,.10) 45%,
    transparent 72%);
  opacity:0;
  transition:opacity .5s ease;
  pointer-events:none;
  z-index:-1;
}

.bubble:hover{
  transform:translateY(-8px) scale(1.06);
  border-color:rgba(255,255,255,.95);
  box-shadow:
    0 0 0 1px rgba(184,147,95,.45),
    0 22px 44px rgba(50,69,91,.16),
    0 10px 20px rgba(50,69,91,.10),
    0 0 34px rgba(184,147,95,.30),
    inset 0 2px 8px rgba(255,255,255,1),
    inset 0 -12px 26px rgba(184,147,95,.16),
    inset 0 0 30px rgba(255,255,255,.5);
}

.bubble:hover .halo{opacity:1}

.bubble:hover svg,
.bubble:hover .bubble-logo,
.bubble:hover .bubble-logo-ward{
  transform:scale(1.1);
  filter:drop-shadow(0 4px 10px rgba(184,147,95,.35));
}

.bubble:active{
  transform:translateY(-3px) scale(1.02);
  transition:transform .12s ease;
}

/* إخفاء الفقاعات الإضافية مؤقتاً */
.bubble.hidden{
  display:none;
}

.bubble:nth-child(1){animation:bubbleFloat 5s ease-in-out infinite}
.bubble:nth-child(2){animation:bubbleFloat 5s ease-in-out infinite .6s}
.bubble:nth-child(3){animation:bubbleFloat 5s ease-in-out infinite 1.2s}
.bubble:nth-child(4){animation:bubbleFloat 5s ease-in-out infinite 1.8s}
.bubble:nth-child(5){animation:bubbleFloat 5s ease-in-out infinite 2.4s}

@keyframes bubbleFloat{
  0%,100%{margin-top:0}
  50%{margin-top:-7px}
}

/* ===== استجابة للجوال ===== */
@media (max-width:900px){
  .center-glow{width:600px;height:600px}
  .glow-1,.glow-2{width:400px;height:400px}
}

@media (max-width:520px){
  .container{
    gap:24px;
    padding:30px 16px 60px;
  }
  .logo{
    width:78vw;
    max-height:45vh;
  }
  .separator{width:80vw}
  .center-glow{width:400px;height:400px}
  .glow-1,.glow-2{width:300px;height:300px}
  .partners{
    gap:18px;
    width:92vw;
  }
  .bubble{width:78px;height:78px}
}
</style>
</head>
<body>

<div class="glow-1"></div>
<div class="glow-2"></div>
<div class="center-glow"></div>

<div class="container">

  <!-- الشعار الرئيسي -->
  <img src="Logo.png" alt="Nexus Group" class="logo">

  <!-- الفاصل الذهبي -->
  <div class="separator">
    <span class="separator-line"></span>
    <span class="separator-dot"></span>
    <span class="separator-line"></span>
  </div>

  <!-- فقاعات الصابون -->
  <div class="partners">

    <!-- 1) WardLogo.png -->
    <a href="PAGE1.html" class="bubble" aria-label="Ward">
      <span class="halo"></span>
      <img src="WardLogo.png" alt="Ward" class="bubble-logo-ward">
    </a>

    <!-- 2) Cl Logo.png - Digital Nexus -->
    <a href="PAGE2.html" class="bubble" aria-label="Digital Nexus">
      <span class="halo"></span>
      <img src="Cl Logo.png" alt="Digital Nexus" class="bubble-logo">
    </a>

    <!-- 3) الشعار الثالث -->
    <a href="PAGE3.html" class="bubble" aria-label="الجهة الثالثة">
      <span class="halo"></span>
      <img src="Logo3.png" alt="الجهة الثالثة" class="bubble-logo">
    </a>

    <!-- 4) الشعار الرابع — مخفي مؤقتاً -->
    <a href="PAGE4.html" class="bubble hidden" aria-label="الجهة الرابعة">
      <span class="halo"></span>
      <img src="Logo4.png" alt="الجهة الرابعة" class="bubble-logo">
    </a>

  </div>

</div>

</body>
</html>
