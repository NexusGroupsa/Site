<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Group</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;}

body{
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
  position:relative;

  /* ✅ خلفية فخمة مدمجة */
  background:
    /* وهج ذهبي مركزي */
    radial-gradient(circle at 50% 50%, rgba(184,147,95,.10) 0%, transparent 55%),
    /* وهج كحلي خفيف على الأطراف */
    radial-gradient(circle at 15% 20%, rgba(50,69,91,.06) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(50,69,91,.06) 0%, transparent 45%),
    /* تدرج أوف وايت فخم */
    linear-gradient(135deg, #FDFCFA 0%, #F7F4EF 50%, #F0EBE3 100%);
}

/* ✅ شبكة هندسية ناعمة */
body::before{
  content:'';
  position:fixed;inset:0;pointer-events:none;
  opacity:.55;
  background-image:
    linear-gradient(rgba(50,69,91,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(50,69,91,.035) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 75%);
}

/* ✅ نقاط ناعمة إضافية */
body::after{
  content:'';
  position:fixed;inset:0;pointer-events:none;
  opacity:.20;
  background-image:radial-gradient(rgba(50,69,91,.10) 1px, transparent 1px);
  background-size:24px 24px;
}

/* هالات لونية */
.glow-1{
  position:fixed;
  width:600px;height:600px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(226,232,240,.7) 0%,transparent 70%);
  top:-250px;left:-200px;
  pointer-events:none;
  filter:blur(50px);
  z-index:1;
}
.glow-2{
  position:fixed;
  width:600px;height:600px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(184,147,95,.18) 0%,transparent 70%);
  bottom:-250px;right:-200px;
  pointer-events:none;
  filter:blur(50px);
  z-index:1;
}

/* ✅ وهج ذهبي خلف الشعار */
.center-glow{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:900px;height:900px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(184,147,95,.14) 0%,
    rgba(184,147,95,.06) 35%,
    transparent 70%);
  pointer-events:none;
  z-index:1;
  animation:glowPulse 6s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
}

/* الحاوية */
.container{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:36px;
  text-align:center;
  animation:fadeIn 1.2s cubic-bezier(.2,.7,.3,1);
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px) scale(.96)}
  to{opacity:1;transform:none}
}

/* الشعار */
.logo{
  width:clamp(300px, 45vw, 800px);
  height:auto;
  max-height:65vh;
  object-fit:contain;
  display:block;
  filter:
    drop-shadow(0 20px 40px rgba(50,69,91,.18))
    drop-shadow(0 4px 12px rgba(184,147,95,.10));
  animation:floatLogo 4s ease-in-out infinite;
  position:relative;
  z-index:3;
}

@keyframes floatLogo{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* الفاصل الذهبي */
.separator{
  display:flex;
  align-items:center;
  gap:14px;
  width:clamp(280px, 40vw, 600px);
  opacity:0;
  animation:fadeInSeparator 1s ease .6s forwards;
  position:relative;
  z-index:3;
}

@keyframes fadeInSeparator{
  to{opacity:1}
}

.separator-line{
  flex:1;
  height:1px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(184,147,95,.6) 50%,
    transparent 100%);
}
.separator-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:linear-gradient(145deg,#B8935F,#E5C99F);
  box-shadow:
    0 0 12px rgba(184,147,95,.7),
    0 0 24px rgba(184,147,95,.35);
  animation:dotPulse 2.5s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:.85}
}

/* استجابة للجوال */
@media (max-width:900px){
  .center-glow{width:600px;height:600px}
  .glow-1,.glow-2{width:400px;height:400px}
}

@media (max-width:520px){
  .container{gap:28px}
  .logo{width:80vw;max-height:55vh}
  .separator{width:80vw}
  .center-glow{width:400px;height:400px}
  .glow-1,.glow-2{width:300px;height:300px}
}
</style>
</head>
<body>

<div class="glow-1"></div>
<div class="glow-2"></div>
<div class="center-glow"></div>

<div class="container">

  <!-- الشعار -->
  <img src="Logo.png" alt="Nexus Group" class="logo">

  <!-- الفاصل الذهبي -->
  <div class="separator">
    <span class="separator-line"></span>
    <span class="separator-dot"></span>
    <span class="separator-line"></span>
  </div>

</div>

</body>
</html>
