<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Group</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:#FAF8F5;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
  position:relative;
}

/* خلفية نقاط ناعمة */
body::before{
  content:'';
  position:fixed;inset:0;pointer-events:none;
  opacity:.35;
  background-image:radial-gradient(rgba(50,69,91,.08) 1px,transparent 1px);
  background-size:24px 24px;
}

/* هالات لونية */
.glow-1{
  position:fixed;
  width:500px;height:500px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(226,232,240,.6) 0%,transparent 70%);
  top:-200px;left:-150px;
  pointer-events:none;
  filter:blur(40px);
}
.glow-2{
  position:fixed;
  width:500px;height:500px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(184,147,95,.15) 0%,transparent 70%);
  bottom:-200px;right:-150px;
  pointer-events:none;
  filter:blur(40px);
}

/* الحاوية */
.container{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:36px;
  text-align:center;
  animation:fadeIn 1.2s cubic-bezier(.2,.7,.3,1);
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px) scale(.96)}
  to{opacity:1;transform:none}
}

/* الشعار */
.logo{
  width:clamp(280px, 40vw, 600px);
  height:auto;
  max-height:60vh;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 20px 40px rgba(50,69,91,.15));
  animation:floatLogo 4s ease-in-out infinite;
}

@keyframes floatLogo{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* الفاصل الذهبي */
.separator{
  display:flex;
  align-items:center;
  gap:14px;
  width:clamp(280px, 40vw, 600px);
  opacity:0;
  animation:fadeInSeparator 1s ease .6s forwards;
}

@keyframes fadeInSeparator{
  to{opacity:1}
}

.separator-line{
  flex:1;
  height:1px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(184,147,95,.6) 50%,
    transparent 100%);
}
.separator-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:linear-gradient(145deg,#B8935F,#E5C99F);
  box-shadow:
    0 0 12px rgba(184,147,95,.7),
    0 0 24px rgba(184,147,95,.35);
  animation:dotPulse 2.5s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:.85}
}

/* استجابة للجوال */
@media (max-width:520px){
  .container{gap:28px}
  .logo{width:75vw;max-height:50vh}
  .separator{width:75vw}
}
</style>
</head>
<body>

<div class="glow-1"></div>
<div class="glow-2"></div>

<div class="container">

  <!-- الشعار -->
 <img src="Logo.png" alt="Nexus Group" class="logo">

  <!-- ✅ الفاصل الذهبي -->
  <div class="separator">
    <span class="separator-line"></span>
    <span class="separator-dot"></span>
    <span class="separator-line"></span>
  </div>

</div>

</body>
</html>
