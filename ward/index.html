<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ward | ورد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root{
  --ink:#1F2D3D;
  --muted:#5A6B7E;
  --paper:#FFFFFF;
  --paper-2:#F8FAFC;
  --line:#E2E8F0;
  --rose:#32455B;
  --rose-2:#4A6078;
  --gold:#B8935F;
  --gold-soft:#EFE0C8;
  --shadow:0 26px 80px rgba(50,69,91,.12);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(226,232,240,.6), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(50,69,91,.08), transparent 25%),
    #F1F3F5;
  color:var(--ink);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:34px;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(50,69,91,.06) 1px,transparent 1px);
  background-size:18px 18px;
}

.stage{
  position:relative;
  width:min(1380px, 100%);
  aspect-ratio:16/9;
}

.deck{
  position:absolute;
  inset:0;
  border-radius:30px;
  overflow:hidden;
  background:var(--paper);
  border:1px solid rgba(50,69,91,.08);
  box-shadow:var(--shadow), 0 0 0 8px rgba(255,255,255,.6);
  display:flex;
  flex-direction:column;
}

/* ==================== الشريط العلوي ==================== */
.top-nav{
  position:relative;
  z-index:20;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:4px;
  padding:12px 22px;
  background:linear-gradient(135deg,
    rgba(255,255,255,.98) 0%,
    rgba(248,250,252,.95) 50%,
    rgba(255,255,255,.98) 100%);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid rgba(226,232,240,.8);
  overflow-x:auto;
  scrollbar-width:none;
  min-height:78px;
}
.top-nav::-webkit-scrollbar{display:none}

.brand{
  display:flex;
  align-items:center;
  padding-left:16px;
  margin-left:6px;
  border-left:1px solid rgba(226,232,240,.9);
  flex-shrink:0;
}
.brand img{
  height:140px;
  width:auto;
  display:block;
  object-fit:contain;
  filter:drop-shadow(0 3px 8px rgba(50,69,91,.12));
}

.top-pill{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:10px 14px;
  border:1px solid transparent;
  border-radius:999px;
  background:transparent;
  cursor:pointer;
  font-family:'Cairo',sans-serif;
  font-size:13px;
  font-weight:800;
  color:#3E5372;
  white-space:nowrap;
  flex-shrink:0;
  transition:.35s cubic-bezier(.2,.7,.3,1);
}
.top-pill::before{
  content:'';
  width:5px;
  height:5px;
  border-radius:50%;
  background:rgba(50,69,91,.3);
  flex-shrink:0;
  transition:.35s ease;
}
.top-pill:not(.active):hover{
  background:rgba(248,250,252,.9);
  border-color:rgba(226,232,240,.9);
  box-shadow:0 6px 16px rgba(50,69,91,.08);
  color:#32455B;
  transform:translateY(-1px);
}
.top-pill:not(.active):hover::before{
  background:#32455B;
  transform:scale(1.5);
}
.top-pill.active{
  background:linear-gradient(135deg,#32455B,#1F2D3D 55%,#4A6078);
  color:#FFFFFF;
  border-color:rgba(50,69,91,.3);
  box-shadow:
    0 10px 24px rgba(50,69,91,.35),
    0 0 0 1px rgba(184,147,95,.35),
    inset 0 1px 0 rgba(255,255,255,.25);
  transform:translateY(-1px);
}
.top-pill.active::before{
  background:linear-gradient(145deg,#B8935F,#E5C99F);
  box-shadow:
    0 0 8px rgba(184,147,95,.9),
    0 0 14px rgba(184,147,95,.5);
  animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}
.top-pill.active::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(184,147,95,.35) 45%,
    rgba(184,147,95,.55) 50%,
    rgba(184,147,95,.35) 55%,
    transparent 100%);
  background-size:200% 100%;
  animation:shine 3s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shine{
  0%{background-position:100% 0}
  50%{background-position:-100% 0}
  100%{background-position:100% 0}
}

.lang-toggle{
  margin-right:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 16px;
  border-radius:999px;
  border:1px solid rgba(50,69,91,.2);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  cursor:pointer;
  font-family:'Cairo',sans-serif;
  font-size:12.5px;
  font-weight:900;
  color:#32455B;
  flex-shrink:0;
  transition:.3s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 4px 12px rgba(50,69,91,.05);
}
.lang-toggle:hover{
  background:linear-gradient(135deg,#32455B,#1F2D3D);
  color:#FFFFFF;
  border-color:#32455B;
  box-shadow:0 10px 22px rgba(50,69,91,.35);
  transform:translateY(-1px);
}
.lang-toggle svg{
  width:16px;height:16px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.lang-toggle .flag{
  font-size:14px;
  line-height:1;
}

/* ==================== منطقة الشرائح ==================== */
.slide-area{
  position:relative;
  flex:1;
  overflow:hidden;
  min-height:0;
}

.slide{
  position:absolute;inset:0;
  padding:34px 50px 32px;
  background:linear-gradient(135deg,#FFFFFF 0%,#F8FAFC 55%,#F1F5F9 100%);
  overflow:hidden;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateY(12px) scale(.985);
  transition:opacity .45s ease,transform .45s ease,visibility .45s ease;
}
.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}

.glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.5}
.glow-1{width:340px;height:340px;background:rgba(226,232,240,.7);top:-180px;left:-120px}
.glow-2{width:300px;height:300px;background:rgba(50,69,91,.06);bottom:-170px;right:-80px}
.glow-3{width:220px;height:220px;background:rgba(184,147,95,.06);top:36%;right:35%}
.grid-overlay{
  position:absolute;inset:0;pointer-events:none;opacity:.15;
  background-image:
    linear-gradient(rgba(50,69,91,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(50,69,91,.04) 1px,transparent 1px);
  background-size:42px 42px;
}

.content-wrap{
  position:relative;
  z-index:3;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:0 30px;
  min-height:0;
}

.block{
  position:relative;
  background:rgba(255,255,255,.9);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px 28px 18px;
  box-shadow:0 14px 36px rgba(50,69,91,.06);
  overflow:hidden;
  flex-shrink:0;
}
.block::before{
  content:'WARD';
  position:absolute;
  left:24px;
  bottom:6px;
  font-size:56px;
  font-weight:900;
  color:rgba(50,69,91,.04);
  letter-spacing:6px;
  pointer-events:none;
}
.quote-mark{
  position:absolute;
  right:22px;
  top:-22px;
  font-size:90px;
  color:rgba(50,69,91,.08);
  font-family:Georgia,serif;
  line-height:1;
}
.block-title{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}
.block-title-icon{
  width:40px;height:40px;
  border-radius:12px;
  display:grid;place-items:center;
  flex-shrink:0;
  background:linear-gradient(145deg,#4A6078,#32455B);
  box-shadow:0 10px 22px rgba(50,69,91,.28), inset 0 1px 0 rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.3);
}
.block-title-icon svg{width:21px;height:21px;stroke:#FFFFFF;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.block-title h2{font-size:20px;font-weight:900;color:var(--ink);line-height:1.15;letter-spacing:-.5px}
.block-title h2 span{color:var(--rose)}
.block-text{
  position:relative;
  z-index:2;
  font-size:14px;
  line-height:1.85;
  color:#4A5A6E;
  font-weight:500;
  text-align:justify;
  padding-right:14px;
  border-right:3px solid transparent;
  border-image:linear-gradient(180deg,#32455B,#B8935F) 1;
}
.block-text strong{color:var(--rose);font-weight:900}
.block-text .highlight{
  color:var(--ink);
  font-weight:800;
  background:linear-gradient(180deg,transparent 55%,rgba(184,147,95,.25) 55%);
  padding:0 4px;
}

.separator{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:2px 0 0;
  flex-shrink:0;
}
.separator-line{
  flex:1;
  height:1px;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(226,232,240,.9) 20%,
    rgba(184,147,95,.5) 50%,
    rgba(226,232,240,.9) 80%,
    transparent 100%);
}
.separator-dot{
  width:7px;height:7px;border-radius:50%;
  background:linear-gradient(145deg,#B8935F,#E5C99F);
  box-shadow:0 0 8px rgba(184,147,95,.6), 0 0 16px rgba(184,147,95,.3);
  animation:dotPulse2 2.5s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dotPulse2{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:.85}
}

.c1{background:linear-gradient(145deg,#4A6078,#32455B)}
.c2{background:linear-gradient(145deg,#5F7A94,#3B5370)}
.c3{background:linear-gradient(145deg,#B8935F,#8B6B43)}
.c4{background:linear-gradient(145deg,#6B7F95,#4A6078)}
.c5{background:linear-gradient(145deg,#A89684,#7A6A5B)}
.c6{background:linear-gradient(145deg,#32455B,#1F2D3D)}
.c7{background:linear-gradient(145deg,#D1C2B6,#A89684)}
.c8{background:linear-gradient(145deg,#8A9BAE,#5F7A94)}

.multi-content{
  position:relative;
  z-index:3;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:14px;
  padding:0 30px;
  min-height:0;
}
.multi-block{
  position:relative;
  background:rgba(255,255,255,.9);
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px 30px 18px;
  box-shadow:0 14px 36px rgba(50,69,91,.06);
  overflow:hidden;
}
.multi-block::before{
  content:'WARD';
  position:absolute;
  left:24px;
  bottom:6px;
  font-size:60px;
  font-weight:900;
  color:rgba(50,69,91,.04);
  letter-spacing:6px;
  pointer-events:none;
}
.multi-block .block-title h2{font-size:21px}
.multi-block .block-text{font-size:15px;line-height:1.9}

.features-grid-4{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:14px;
  flex:1;
  align-content:center;
  min-height:0;
}
.feature-4{
  position:relative;
  background:rgba(255,255,255,.9);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
  transition:.35s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 10px 24px rgba(50,69,91,.06);
  overflow:hidden;
}
.feature-4::before{
  content:'';
  position:absolute;
  top:0;right:0;left:0;
  height:3px;
  background:linear-gradient(90deg,#32455B,#B8935F);
  opacity:0;
  transition:.35s ease;
}
.feature-4:hover{
  transform:translateY(-6px);
  border-color:rgba(50,69,91,.25);
  background:#FFFFFF;
  box-shadow:0 18px 38px rgba(50,69,91,.12);
}
.feature-4:hover::before{opacity:1}
.feature-4 .feature-icon{
  width:62px;height:62px;
  border-radius:19px;
  display:grid;place-items:center;
  flex-shrink:0;
  box-shadow:0 12px 24px rgba(50,69,91,.15);
  transition:.35s ease;
}
.feature-4 .feature-icon svg{
  width:30px;height:30px;
  stroke:#FFFFFF;fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.feature-4:hover .feature-icon{transform:scale(1.08)}
.feature-4 h3{
  font-size:14.5px;
  font-weight:900;
  color:var(--ink);
  line-height:1.3;
  letter-spacing:-.2px;
}
.feature-4 p{
  font-size:11.5px;
  color:#7A8A9C;
  font-weight:600;
  line-height:1.5;
}

.products-grid{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  grid-template-rows:repeat(2, 1fr);
  gap:12px;
  flex:1;
  min-height:0;
}
.product{
  position:relative;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  text-align:center;
  transition:.35s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 6px 18px rgba(50,69,91,.05);
  overflow:hidden;
}
.product::before{
  content:'';
  position:absolute;
  top:0;right:0;left:0;
  height:3px;
  background:linear-gradient(90deg,#32455B,#B8935F);
  opacity:0;
  transition:.35s ease;
}
.product:hover{
  transform:translateY(-6px);
  border-color:rgba(50,69,91,.25);
  box-shadow:0 18px 38px rgba(50,69,91,.14);
}
.product:hover::before{opacity:1}
.product-icon{
  width:56px;height:56px;
  border-radius:18px;
  display:grid;place-items:center;
  flex-shrink:0;
  box-shadow:0 10px 22px rgba(50,69,91,.15);
  transition:.35s ease;
}
.product-icon svg{
  width:26px;height:26px;
  stroke:#FFFFFF;fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.product:hover .product-icon{transform:scale(1.08)}
.product-name{
  font-size:14px;
  font-weight:900;
  color:var(--ink);
  line-height:1.3;
  letter-spacing:-.2px;
}

.gallery{
  position:relative;
  z-index:3;
  flex:1;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  grid-template-rows:repeat(2, 1fr);
  gap:14px;
  min-height:0;
  align-content:center;
  justify-content:center;
}
.gallery-item{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 10px 24px rgba(50,69,91,.10);
  cursor:pointer;
  transition:.35s cubic-bezier(.2,.7,.3,1);
  background:#F1F5F9;
  aspect-ratio:1 / 1;
  max-width:180px;
  max-height:180px;
  width:100%;
  justify-self:center;
  align-self:center;
}
.gallery-item img{
  width:100%;height:100%;object-fit:cover;
  display:block;
  transition:transform .55s cubic-bezier(.2,.7,.3,1),filter .35s ease;
  filter:saturate(.95) contrast(1.02);
}
.gallery-item:hover{
  transform:translateY(-6px) scale(1.03);
  border-color:rgba(50,69,91,.35);
  box-shadow:0 20px 42px rgba(50,69,91,.18);
  z-index:5;
}
.gallery-item:hover img{
  transform:scale(1.09);
  filter:saturate(1.08) contrast(1.05);
}
.gallery-item::before{
  content:'';position:absolute;top:0;right:0;left:0;height:3px;z-index:3;
  background:linear-gradient(90deg,#32455B,#B8935F);
  opacity:0;
  transition:.35s ease;
}
.gallery-item:hover::before{opacity:1}
.gallery-overlay{
  position:absolute;inset:auto 0 0 0;
  padding:12px 12px 10px;
  background:linear-gradient(to top,rgba(31,45,61,.9) 0%,rgba(31,45,61,.55) 55%,transparent 100%);
  color:#FFFFFF;
  display:flex;flex-direction:column;gap:2px;
  transform:translateY(0);
  opacity:1;
  transition:.35s ease;
  z-index:3;
}
.gallery-overlay h3{
  font-size:13px;font-weight:900;letter-spacing:-.2px;
  color:#FFFFFF;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}

.partners-grid{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:24px;
  flex:1;
  align-content:center;
  min-height:0;
}

.partner-card{
  position:relative;
  background:transparent;
  border:none;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  transition:.4s cubic-bezier(.2,.7,.3,1);
  overflow:visible;
}

.partner-logo{
  width:220px;
  height:220px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:radial-gradient(circle at 30% 30%, #FFFFFF 0%, #F8FAFC 100%);
  border:none;
  box-shadow:
    0 16px 36px rgba(50,69,91,.14),
    0 6px 14px rgba(50,69,91,.08);
  transition:.4s cubic-bezier(.2,.7,.3,1);
  position:relative;
  flex-shrink:0;
}

.partner-logo::before{
  content:'';
  position:absolute;
  inset:-10px;
  border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0%,
    rgba(184,147,95,.5) 25%,
    transparent 50%,
    rgba(50,69,91,.35) 75%,
    transparent 100%);
  opacity:0;
  transition:.5s ease;
  animation:rotateGlow 8s linear infinite;
  z-index:-1;
}
.partner-logo::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  box-shadow:inset 0 2px 8px rgba(255,255,255,.9);
  pointer-events:none;
}
@keyframes rotateGlow{
  to{transform:rotate(360deg)}
}

.partner-card:hover .partner-logo{
  transform:scale(1.06);
  box-shadow:
    0 24px 50px rgba(50,69,91,.20),
    0 10px 22px rgba(50,69,91,.10);
}
.partner-card:hover .partner-logo::before{opacity:1}

.partner-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:6px;
  display:block;
  transition:.4s ease;
}
.partner-card:hover .partner-logo img{
  transform:scale(1.05);
}

.partner-name{
  font-size:16px;
  font-weight:900;
  color:var(--ink);
  text-align:center;
  line-height:1.3;
  letter-spacing:-.3px;
  margin-top:4px;
}
.partner-tag{
  font-size:11px;
  font-weight:700;
  color:#32455B;
  background:linear-gradient(135deg, rgba(50,69,91,.08), rgba(184,147,95,.12));
  padding:5px 14px;
  border-radius:50px;
  letter-spacing:.3px;
  border:1px solid rgba(50,69,91,.10);
}

.contact-grid{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  flex:1;
  min-height:0;
  align-content:center;
}
.contact-card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:16px;
  padding:28px 24px;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:24px;
  text-decoration:none;
  color:inherit;
  transition:.4s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 12px 30px rgba(50,69,91,.06);
  overflow:hidden;
}
.contact-card::before{
  content:'';
  position:absolute;
  top:0;right:0;left:0;
  height:4px;
  transition:.4s ease;
}
.contact-card.whatsapp::before{
  background:linear-gradient(90deg,#25d366,#128c7e);
}
.contact-card.tiktok::before{
  background:linear-gradient(90deg,#1F2D3D,#32455B);
}
.contact-card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 45px rgba(50,69,91,.12);
}
.contact-card.whatsapp:hover{
  border-color:rgba(37,211,102,.4);
}
.contact-card.tiktok:hover{
  border-color:rgba(50,69,91,.4);
}
.contact-icon{
  width:80px;height:80px;
  border-radius:24px;
  display:grid;place-items:center;
  flex-shrink:0;
  box-shadow:0 14px 30px rgba(50,69,91,.18);
  transition:.4s ease;
  position:relative;
}
.contact-card:hover .contact-icon{
  transform:scale(1.08) rotate(-3deg);
}
.contact-icon svg{
  width:40px;height:40px;
  stroke:#fff;fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.contact-icon.whatsapp-bg{
  background:linear-gradient(145deg,#25d366,#128c7e);
  box-shadow:0 14px 30px rgba(37,211,102,.30);
}
.contact-icon.tiktok-bg{
  background:linear-gradient(145deg,#1F2D3D,#32455B);
  box-shadow:0 14px 30px rgba(50,69,91,.35);
}
.contact-info{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
  position:relative;
  z-index:1;
}
.contact-label{
  font-size:15px;
  font-weight:900;
  color:var(--ink);
  letter-spacing:-.2px;
}
.contact-label span{color:var(--rose)}
.contact-subtitle{
  font-size:12px;
  font-weight:600;
  color:#7A8A9C;
  line-height:1.5;
  max-width:250px;
}
.contact-value{
  margin-top:6px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 18px;
  border-radius:50px;
  font-size:15px;
  font-weight:900;
  direction:ltr;
  letter-spacing:.5px;
  transition:.35s ease;
  background:rgba(50,69,91,.06);
  color:#32455B;
  border:1px solid rgba(50,69,91,.15);
}
.contact-card.whatsapp .contact-value{
  background:rgba(37,211,102,.10);
  color:#128c7e;
  border-color:rgba(37,211,102,.25);
}
.contact-card.tiktok .contact-value{
  background:rgba(50,69,91,.10);
  color:#32455B;
  border-color:rgba(50,69,91,.2);
}
.contact-card:hover .contact-value{
  transform:scale(1.05);
}
.contact-arrow{
  display:inline-flex;
  width:14px;height:14px;
  align-items:center;
  justify-content:center;
}
.contact-arrow svg{
  width:100%;height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.lightbox{
  position:fixed;inset:0;z-index:999;
  background:rgba(31,45,61,.94);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;justify-content:center;
  padding:40px;
  opacity:0;
  transition:opacity .3s ease;
}
.lightbox.open{display:flex;opacity:1}
.lightbox img{
  max-width:94vw;max-height:90vh;
  width:auto;height:auto;
  border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  border:2px solid rgba(255,255,255,.2);
  animation:zoomIn .35s ease;
  object-fit:contain;
}
@keyframes zoomIn{
  from{transform:scale(.94);opacity:0}
  to{transform:scale(1);opacity:1}
}
.lightbox-close{
  position:absolute;top:22px;left:22px;
  width:48px;height:48px;border-radius:14px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);
  color:#FFFFFF;cursor:pointer;
  display:grid;place-items:center;
  transition:.25s ease;
}
.lightbox-close:hover{background:#B8935F;border-color:#B8935F;transform:rotate(90deg)}
.lightbox-close svg{width:22px;height:22px;stroke:#fff;stroke-width:2.5;fill:none}
